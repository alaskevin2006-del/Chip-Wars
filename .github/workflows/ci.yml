name: Verify game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash -n ops/deploy.sh && bash -n ops/preflight.sh && bash -n ops/rollback.sh
      - run: bash ops/test-release-paths.sh
      - run: python3 -m unittest discover -s ops -p test_diplomacy_release.py
